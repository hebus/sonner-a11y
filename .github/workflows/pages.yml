name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# allow GITHUB_TOKEN to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# let a running deployment finish, but only queue the most recent push behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # the website resolves `sonner-a11y` to dist/, so the library must be built first
      - run: pnpm build

      - name: Build website
        run: pnpm --filter website build
        env:
          # the site is served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
        with:
          # turn Pages on if it is not already, instead of failing with a 404 the way the
          # first run did: the workflow landed on main before Pages had been enabled
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
