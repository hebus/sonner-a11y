name: Feature request
description: Propose a change to the API or the behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, rather than the API you have in mind. It often has a bearing on the answer.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Sketch the API if you have one in mind.
      render: js
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing options, or a workaround in your own code.
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: I have considered how this behaves with a screen reader and with a keyboard only
